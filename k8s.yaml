apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-python-deployment
  labels:
    app: nginx-python
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-python
  template:
    metadata:
      labels:
        app: nginx-python
    spec:
      containers:
      - name: nginx
        image: control-plane:1.0.2
        ports:
          - containerPort: 8080
        volumeMounts:
          - name: nginx-conf
            mountPath: /etc/nginx/conf.d/default.conf
            subPath: default.conf
      - name: python
        image: api:1.0.3
        workingDir: /app
        command: ["python", "app.py"]
        ports:
          - containerPort: 5050
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-python-service
spec:
  selector:
    app: nginx-python
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 31180
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  default.conf: |
    server {
        listen 8080;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Health check
        location /healthz {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Proxy para la API Flask - IMPORTANTE: Usar proxy_pass sin / al final
        location /api/ {
            proxy_pass http://127.0.0.1:5050;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Headers para evitar problemas de CORS
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
        }

        # Ruta para el inventario (HTML) - debe ir después de /api/
        location /inventario {
            proxy_pass http://127.0.0.1:5050/inventario;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Archivos estáticos
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot)$ {
            expires 30d;
            access_log off;
            add_header Cache-Control "public";
        }

        # Página principal (HTML estático de Nginx)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }