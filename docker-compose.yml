services:
  admin-control-panel:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - REACT_APP_MESSAGE=None
    container_name: admin-control-panel
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - control-panel-network
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - .env
    environment:
      - REACT_APP_MESSAGE=None
    container_name: api
    ports:
      - "5050:5050"
    restart: unless-stopped
    networks:
      - control-panel-network

networks:
  control-panel-network: